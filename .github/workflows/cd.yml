name: Continuous Delivery

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkando código
        uses: actions/checkout@v7

      - name: Setando Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalando dependências
        run: npm ci

      - name: Simulando testes, build e deploy
        run: | # Roda os scripts test, build e deploy escritos em package.json
          npm run test
          npm run build
          npm run deploy

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4