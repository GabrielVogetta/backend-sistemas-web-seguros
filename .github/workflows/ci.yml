name: Continuous Integration

on:
  pull_request:
    branches: [test]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkando código
        uses: actions/checkout@v7

      - name: Setando Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalando dependências
        run: npm ci

      - name: Simulando testes
        run: npm run test # roda script test escrito em package.json